name: Bug report
description: Report a problem with the local NullSquare application
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps, expected result and observed result
      description: Use sample data and redact credentials and private evidence.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system, Node.js version and revision
    validations:
      required: true
