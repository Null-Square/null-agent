# The Null AI app: the built files, and /api proxied to the backend on the compose network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Scope documents and evidence uploads go through /api.
    client_max_body_size 30m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Docker's resolver, so a restarted backend is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # The backend's only door (localHostOnly) checks the Host and Origin the browser sent, so both
        # pass through unchanged. Origin is forwarded as is; Host is set back to the browser's own.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Server-sent events (/api/notifications/stream and each session's stream) reach the page
        # as they happen, and an open stream is not cut after nginx's default 60 seconds.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # A private runner keeps one WebSocket open here; it proves itself with its own runner token.
    location /api/app/runner-agent/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Sign in with ChatGPT returns the browser here; the backend checks the one-time state.
    location = /auth/callback {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # Hashed build files never change under the same name.
    location /assets/ {
        expires 1y;
    }

    # Client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
