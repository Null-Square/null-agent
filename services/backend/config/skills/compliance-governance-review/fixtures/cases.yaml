    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: compliance-governance-review-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: compliance-governance-review-positive-1-observation
              content: The governance record identified accountable owner, approver, review cadence, and current approval for the named control.
            - id: compliance-governance-review-positive-1-floor
              content: The required decision floor is approved policy/control ownership, decision rights, review cadence, exception lifecycle, and retained evidence.
            - id: compliance-governance-review-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - compliance-governance-review-positive-1-observation
        - compliance-governance-review-positive-1-floor
        - compliance-governance-review-positive-1-control
      forbidden_evidence_ids: []
