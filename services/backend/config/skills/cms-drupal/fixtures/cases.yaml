    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: cms-drupal-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: cms-drupal-positive-1-observation
              content: Anonymous access read an unpublished evaluator node canary that the active Drupal permission matrix reserved for editors.
            - id: cms-drupal-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is active Drupal extension/configuration, role/entity controls, and a synthetic entity outcome.
            - id: cms-drupal-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - cms-drupal-positive-1-observation
        - cms-drupal-positive-1-context
        - cms-drupal-positive-1-control
      forbidden_evidence_ids: []
