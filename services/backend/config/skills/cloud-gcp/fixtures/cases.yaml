        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: cloud-gcp-positive-1-observation
              content: An anonymous Cloud Storage request returned the named private evaluator object with nonexistent and owner controls.
            - id: cloud-gcp-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is public GCP service identity, deployed policy/source provenance, named synthetic resource, and anonymous/owner controls.
            - id: cloud-gcp-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - cloud-gcp-positive-1-observation
        - cloud-gcp-positive-1-context
        - cloud-gcp-positive-1-control
      forbidden_evidence_ids: []
