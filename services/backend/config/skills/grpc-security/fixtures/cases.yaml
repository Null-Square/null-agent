schema_version: 1
skill: grpc-security
cases:
  - id: grpc-security-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: grpc-security-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: grpc-security-positive-1-observation
              content: An unauthenticated unary call returned the supplied private message canary from a method marked authenticated.
            - id: grpc-security-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is descriptor/method provenance, evaluator metadata, named message fields, and status/response controls.
            - id: grpc-security-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - grpc-security-positive-1-observation
        - grpc-security-positive-1-context
        - grpc-security-positive-1-control
      forbidden_evidence_ids: []
