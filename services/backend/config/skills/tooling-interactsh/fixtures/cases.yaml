schema_version: 1
skill: tooling-interactsh
cases:
  - id: tooling-interactsh-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-interactsh-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-interactsh-positive-1-observation
              content: Interactsh issued one unique evaluator nonce and correlated the expected DNS callback from the local fixture.
            - id: tooling-interactsh-positive-1-floor
              content: The required decision floor is owner-controlled correlation service, unique nonce, bounded approved callback class, and no sensitive exfiltration.
            - id: tooling-interactsh-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-interactsh-positive-1-observation
        - tooling-interactsh-positive-1-floor
        - tooling-interactsh-positive-1-control
      forbidden_evidence_ids: []
