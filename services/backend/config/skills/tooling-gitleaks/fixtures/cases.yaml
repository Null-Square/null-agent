schema_version: 1
skill: tooling-gitleaks
cases:
  - id: tooling-gitleaks-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-gitleaks-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-gitleaks-positive-1-observation
              content: Gitleaks scanned the supplied commit range with the pinned config and retained a redacted high-confidence credential pattern.
            - id: tooling-gitleaks-positive-1-floor
              content: The required decision floor is pinned repository scope/ruleset, secret candidate provenance, validation without use, and redacted retention.
            - id: tooling-gitleaks-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-gitleaks-positive-1-observation
        - tooling-gitleaks-positive-1-floor
        - tooling-gitleaks-positive-1-control
      forbidden_evidence_ids: []
