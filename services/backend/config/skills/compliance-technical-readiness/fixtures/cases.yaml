schema_version: 1
skill: compliance-technical-readiness
cases:
  - id: compliance-technical-readiness-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: compliance-technical-readiness-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: compliance-technical-readiness-positive-1-observation
              content: The readiness review linked an in-scope system to control owner, technical configuration, log source, retention, executable test evidence, and the named remediation dependency required before validation.
            - id: compliance-technical-readiness-positive-1-floor
              content: The required decision floor is system inventory, control implementation evidence, owner, logging/retention state, testability, and remediation dependency.
            - id: compliance-technical-readiness-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - compliance-technical-readiness-positive-1-observation
        - compliance-technical-readiness-positive-1-floor
        - compliance-technical-readiness-positive-1-control
      forbidden_evidence_ids: []
