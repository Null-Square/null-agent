schema_version: 1
skill: tooling-tls
cases:
  - id: tooling-tls-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-tls-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-tls-positive-1-observation
              content: Two bounded handshakes confirmed the deprecated protocol was actually negotiated for the in-scope hostname.
            - id: tooling-tls-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is exact hostname/SNI/port, bounded handshake, negotiated result, chain hash, and policy context.
            - id: tooling-tls-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-tls-positive-1-observation
        - tooling-tls-positive-1-context
        - tooling-tls-positive-1-control
      forbidden_evidence_ids: []
