      execution:
        task: classify-evidence
        artifact_type: broken-auth-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: broken-auth-positive-1-observation
              content: The evaluator login accepted a supplied invalidated password after the password-change control confirmed the new password was active.
            - id: broken-auth-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is evaluator identity lifecycle, intended authentication policy, and deterministic unauthorized session/account outcome.
            - id: broken-auth-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - broken-auth-positive-1-observation
        - broken-auth-positive-1-context
        - broken-auth-positive-1-control
      forbidden_evidence_ids: []
