schema_version: 1
skill: compliance-evidence-review
cases:
  - id: compliance-evidence-review-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: compliance-evidence-review-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: compliance-evidence-review-positive-1-observation
              content: The evidence bundle included immutable hashes, source system, collection time, reviewer, and control mapping.
            - id: compliance-evidence-review-positive-1-floor
              content: The required decision floor is authenticity, provenance, period, completeness, reviewer independence, and explicit limitation.
            - id: compliance-evidence-review-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - compliance-evidence-review-positive-1-observation
        - compliance-evidence-review-positive-1-floor
        - compliance-evidence-review-positive-1-control
      forbidden_evidence_ids: []
