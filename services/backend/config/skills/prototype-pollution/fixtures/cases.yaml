          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: prototype-pollution-positive-1-observation
              content: A supplied nested key changed an inherited evaluator canary on a fresh object in the local harness while the fixed merge kept it absent.
            - id: prototype-pollution-positive-1-floor
              content: The required decision floor is instrumented disposable JavaScript object graph, attacker-controlled merge path, own/inherited property controls, and harmless canary effect.
