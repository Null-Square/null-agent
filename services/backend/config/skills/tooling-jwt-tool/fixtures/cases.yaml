        task: classify-evidence
        artifact_type: tooling-jwt-tool-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-jwt-tool-positive-1-observation
              content: The tool decoded a redacted evaluator token and inventoried issuer, audience, algorithm, key id, and time claims offline.
            - id: tooling-jwt-tool-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is offline evaluator token, verification material provenance, redaction, and owning protocol interpretation.
            - id: tooling-jwt-tool-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-jwt-tool-positive-1-observation
        - tooling-jwt-tool-positive-1-context
        - tooling-jwt-tool-positive-1-control
      forbidden_evidence_ids: []
