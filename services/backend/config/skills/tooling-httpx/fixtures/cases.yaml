schema_version: 1
skill: tooling-httpx
cases:
  - id: tooling-httpx-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-httpx-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-httpx-positive-1-observation
              content: httpx probed the supplied hostname list once and retained status, title, technology hints, and response hash.
            - id: tooling-httpx-positive-1-floor
              content: The required decision floor is allowlisted host input, bounded probes, stable response fingerprint, and deduplicated inventory output.
            - id: tooling-httpx-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-httpx-positive-1-observation
        - tooling-httpx-positive-1-floor
        - tooling-httpx-positive-1-control
      forbidden_evidence_ids: []
