schema_version: 1
skill: oauth-oidc
cases:
  - id: oauth-oidc-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: oauth-oidc-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: oauth-oidc-positive-1-observation
              content: The relying party accepted an evaluator authorization response with swapped state and bound it to the wrong evaluator browser session.
            - id: oauth-oidc-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is evaluator client/identity, complete authorization transaction, binding value, callback/token exchange, and application session.
            - id: oauth-oidc-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - oauth-oidc-positive-1-observation
        - oauth-oidc-positive-1-context
        - oauth-oidc-positive-1-control
      forbidden_evidence_ids: []
