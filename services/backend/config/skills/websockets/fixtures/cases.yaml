schema_version: 1
skill: websockets
cases:
  - id: websockets-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: websockets-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: websockets-positive-1-observation
              content: An unauthenticated connection joined the supplied private evaluator channel and received its one-time canary event.
            - id: websockets-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is bounded handshake, origin/identity/channel controls, named synthetic event, and connection/message caps.
            - id: websockets-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - websockets-positive-1-observation
        - websockets-positive-1-context
        - websockets-positive-1-control
      forbidden_evidence_ids: []
