schema_version: 1
skill: auth0
cases:
  - id: auth0-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: auth0-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: auth0-positive-1-observation
              content: The evaluator Auth0 client accepted an owner-controlled callback absent from the supplied registered callback list and delivered the authorization response there.
            - id: auth0-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is tenant, client, transaction binding, evaluator identity, and resource-server corroboration.
            - id: auth0-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - auth0-positive-1-observation
        - auth0-positive-1-context
        - auth0-positive-1-control
      forbidden_evidence_ids: []
