  - id: ssti-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: ssti-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: ssti-positive-1-observation
              content: A local fixture rendered a simple arithmetic evaluator expression to the expected numeric canary while literal-text control remained unchanged.
            - id: ssti-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is offline template-engine identification, inert expression result, context/escaping controls, and no object/system access.
            - id: ssti-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - ssti-positive-1-observation
        - ssti-positive-1-context
        - ssti-positive-1-control
      forbidden_evidence_ids: []
