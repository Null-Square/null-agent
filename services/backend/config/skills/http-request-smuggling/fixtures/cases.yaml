schema_version: 1
skill: http-request-smuggling
cases:
  - id: request-smuggling-clte-self-canary-proof
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-connection-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        operator_context: Isolated staging origin; both requests and the canary path are owned by the evaluator.
        artifact:
          observations:
            - id: clte-raw
              content: Candidate used one Content-Length and one final Transfer-Encoding chunked field. Captured bytes show a zero chunk followed by "GET /__b1_canary_7f3a HTTP/1.1" on the same evaluator-owned connection.
            - id: clte-candidate
              content: The immediately following self-owned request received the unique /__b1_canary_7f3a response before its own expected response. The event repeated twice with fresh canaries.
            - id: clte-control
              content: Content-Length-only and Transfer-Encoding-only controls, sent with the same body size and connection sequence, each returned exactly one expected response and no canary response.
            - id: clte-cleanup
              content: The connection was closed after each candidate/control pair; no shared-user or cache interaction was used.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids: [clte-raw, clte-candidate, clte-control]
      forbidden_evidence_ids: []

  - id: request-smuggling-tecl-self-canary-proof
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-connection-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        operator_context: Dedicated test listener with connection reuse confirmed.
        artifact:
          observations:
            - id: tecl-raw
              content: Candidate bytes contain Transfer-Encoding chunked and a Content-Length ending before the terminal chunk; the remaining bytes encode a unique harmless canary request.
            - id: tecl-candidate
              content: A second self-owned request on the same socket received the unique canary response followed by its normal response in two of two bounded trials.
            - id: tecl-control
              content: Chunked-only and length-only controls produced normal single-response ordering under the same timeout and body length.
            - id: tecl-socket
              content: Socket identifiers confirm every candidate and its follow-up used the same connection.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids: [tecl-raw, tecl-candidate, tecl-control, tecl-socket]
      forbidden_evidence_ids: []

  - id: request-smuggling-cl0-self-canary-proof
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-connection-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        operator_context: Isolated endpoint known to accept a body on the selected route.
        artifact:
          observations:
            - id: cl0-precondition
              content: Baseline confirms the front end forwards the request body and reuses the connection; the route is not configured to discard bodies.
            - id: cl0-candidate
              content: The body carried a fresh self-owned canary request. The next request on that same connection received the canary response before its expected response, twice.
            - id: cl0-control
              content: An equal-sized inert body control and a connection-close control did not produce an extra response.
            - id: cl0-capture
              content: Raw request bytes, response order, connection identifier, and timestamps are present for candidate and controls.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids: [cl0-precondition, cl0-candidate, cl0-control, cl0-capture]
      forbidden_evidence_ids: []

  - id: request-smuggling-h2cl-downgrade-proof
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: h2-to-h1-gateway-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        operator_context: Staging gateway advertises h2 externally and downgrades to HTTP/1.1 upstream.
        artifact:
          observations:
            - id: h2cl-negotiation
              content: ALPN capture shows h2 at the client edge. Gateway debug capture for the test tenant shows an HTTP/1.1 upstream request with a synthesized Content-Length.
            - id: h2cl-candidate
              content: A DATA-frame length mismatch containing a fresh harmless canary caused the next evaluator-owned stream, pinned to the same upstream connection, to receive the canary response first in two trials.
            - id: h2cl-control
              content: A matched h2 request with consistent DATA length and a forced-new-upstream-connection control produced only their expected responses.
            - id: h2cl-scope
              content: The gateway pool was isolated to the test tenant and torn down after the pair.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids: [h2cl-negotiation, h2cl-candidate, h2cl-control, h2cl-scope]
      forbidden_evidence_ids: []

  - id: request-smuggling-tete-parser-differential-proof
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-connection-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        operator_context: Dedicated test proxy and origin; the mutated transfer-coding syntax is accepted by the edge.
        artifact:
          observations:
            - id: tete-raw
              content: Candidate has two Transfer-Encoding fields, one canonical and one tab-obfuscated. Edge and origin captures show they normalize the pair differently.
            - id: tete-candidate
              content: The unique residual canary response appeared before the evaluator's next response on the same connection in two bounded repetitions.
            - id: tete-control
              content: Canonical duplicate fields and a single canonical field were rejected consistently or produced one normal response; neither emitted the canary.
            - id: tete-attribution
              content: Raw bytes and paired edge/origin parse logs attribute the boundary disagreement to transfer-coding normalization, not caching.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids: [tete-raw, tete-candidate, tete-control, tete-attribution]
      forbidden_evidence_ids: []

  - id: request-smuggling-negative-single-timeout
    kind: negative
    input:
      execution:
        task: classify-evidence
        artifact_type: request-timing-observations
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          observations:
            - id: timeout-one
              content: One CL.TE-shaped candidate timed out at 5.0 seconds.
            - id: timeout-no-control
              content: No matched control, repeat, raw connection identifier, or follow-up canary observation was collected.
            - id: timeout-load
              content: Service latency during the same minute ranged from 0.2 to 6.3 seconds.
    expected:
      disposition: reject
      finding_allowed: false
      required_evidence_ids: [timeout-one, timeout-no-control, timeout-load]
      forbidden_evidence_ids: []

  - id: request-smuggling-negative-candidate-and-control-timeout
    kind: negative
    input:
      execution:
        task: classify-evidence
        artifact_type: request-timing-observations
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          observations:
            - id: equal-timeout-candidate
              content: Candidate timed out at the configured 5-second ceiling in both trials.
            - id: equal-timeout-control
              content: Equal-sized unambiguous controls also timed out at the same ceiling in both trials.
            - id: equal-timeout-health
              content: A health probe reported upstream saturation during every trial.
    expected:
      disposition: reject
      finding_allowed: false
      required_evidence_ids: [equal-timeout-candidate, equal-timeout-control, equal-timeout-health]
      forbidden_evidence_ids: []

  - id: request-smuggling-negative-front-end-rejection
    kind: negative
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-response-set
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          observations:
            - id: reject-candidate
              content: Every conflicting CL/TE candidate returned HTTP 400 from the edge before upstream forwarding.
            - id: reject-connection
              content: The edge sent Connection close and the socket closed after each rejection.
            - id: reject-origin
              content: Isolated origin access logs contain no candidate request or canary path.
            - id: reject-controls
              content: Valid length-only and chunked-only controls reached the origin and returned normally.
    expected:
      disposition: reject
      finding_allowed: false
      required_evidence_ids: [reject-candidate, reject-connection, reject-origin, reject-controls]
      forbidden_evidence_ids: []

  - id: request-smuggling-negative-no-downstream-effect
    kind: negative
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-connection-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          observations:
            - id: stable-candidate
              content: Candidate and next self-owned request each returned exactly one response in correct order across two trials.
            - id: stable-control
              content: Matched controls produced the same response count, order, headers, and latency distribution.
            - id: stable-raw
              content: Raw bytes confirm no unique canary response and no residual bytes after the candidate response.
    expected:
      disposition: reject
      finding_allowed: false
      required_evidence_ids: [stable-candidate, stable-control, stable-raw]
      forbidden_evidence_ids: []

  - id: request-smuggling-negative-unattributed-pooling
    kind: negative
    input:
      execution:
        task: classify-evidence
        artifact_type: proxy-log-excerpt
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          observations:
            - id: pool-extra-response
              content: An extra response was observed after a candidate, but it contains no unique canary and its request id belongs to an unrelated health probe.
            - id: pool-unknown-socket
              content: Client and upstream connection identifiers were not retained, so same-connection ordering cannot be established.
            - id: pool-control
              content: The same extra health response appears in a control window without an ambiguous request.
    expected:
      disposition: reject
      finding_allowed: false
      required_evidence_ids: [pool-extra-response, pool-unknown-socket, pool-control]
      forbidden_evidence_ids: []

  - id: request-smuggling-ambiguous-repeatable-timing
    kind: ambiguous
    input:
      execution:
        task: classify-evidence
        artifact_type: paired-request-timing-series
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          observations:
            - id: timing-candidate
              content: Two bounded CL.TE candidates each took 4.8-5.0 seconds.
            - id: timing-control
              content: Four matched controls returned in 0.20-0.31 seconds.
            - id: timing-no-canary
              content: No same-connection follow-up canary, response-order effect, or origin parse capture is available.
            - id: timing-health
              content: General service latency was stable during the paired trials.
    expected:
      disposition: lead
      finding_allowed: false
      required_evidence_ids: [timing-candidate, timing-control, timing-no-canary]
      forbidden_evidence_ids: []

  - id: request-smuggling-blocked-shared-production-pool
    kind: blocked
    input:
      execution:
        task: classify-evidence
        artifact_type: precondition-record
        authorization:
          policy_allowed: true
          infrastructure_available: false
        operator_context: Public production endpoint with unknown shared connection pooling.
        artifact:
          observations:
            - id: blocked-pool
              content: The evaluator cannot pin candidate and follow-up traffic to a self-owned upstream connection.
            - id: blocked-users
              content: Other users may share the upstream pool, so a canary could affect unrelated traffic.
            - id: blocked-isolation
              content: No staging clone, dedicated test tenant, or maintenance window is available.
    expected:
      disposition: blocked
      finding_allowed: false
      required_evidence_ids: [blocked-pool, blocked-users, blocked-isolation]
      forbidden_evidence_ids: []

  - id: request-smuggling-routing-positive
    kind: routing_positive
    input:
      prompt: Assess CL.TE and HTTP/2 downgrade boundary disagreements with isolated same-connection canaries and matched framing controls.
    expected:
      primary_skill: http-request-smuggling
      top_n: 3

  - id: request-smuggling-routing-negative
    kind: routing_negative
    input:
      prompt: Render the public health-check page and summarize its static uptime text.
    expected:
      absent_skill: http-request-smuggling
      top_n: 5

  - id: request-smuggling-mutation-transfer-encoding-tab
    kind: mutation
    input:
      execution:
        task: classify-evidence
        artifact_type: raw-http-connection-transcript
        authorization:
          policy_allowed: true
          infrastructure_available: true
        operator_context: One parser-axis mutation after a canonical baseline; isolated test proxy.
        artifact:
          observations:
            - id: mutation-baseline
              content: 'Canonical "Transfer-Encoding: chunked" baseline produced one normal response and no residual canary.'
            - id: mutation-bytes
              content: The only changed bytes were a horizontal tab before "chunked" in the duplicate transfer-coding field; body, canary, headers, and connection sequence were unchanged.
            - id: mutation-candidate
              content: The mutated candidate caused the unique self-owned canary response to precede the next expected response in two trials.
            - id: mutation-control
              content: Repeating the canonical baseline between mutation trials did not produce the canary response.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids: [mutation-baseline, mutation-bytes, mutation-candidate, mutation-control]
      forbidden_evidence_ids: []
