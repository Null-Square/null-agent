  - id: validation-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: validation-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: validation-positive-1-observation
              content: Fresh evaluator sessions reproduced peer-object access with owner, peer-canary, and nonexistent controls.
            - id: validation-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is fresh reproduction, raw provenance, owner/negative controls, minimal causal change, and safety/scope check.
            - id: validation-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - validation-positive-1-observation
        - validation-positive-1-context
        - validation-positive-1-control
      forbidden_evidence_ids: []
