schema_version: 1
skill: cors
cases:
  - id: cors-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: cors-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: cors-positive-1-observation
              content: An owner-controlled unrelated origin read the evaluator private canary because the server reflected origin and allowed credentials.
            - id: cors-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is real browser origin, credential state, readable private synthetic data, and preflight/actual controls.
            - id: cors-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - cors-positive-1-observation
        - cors-positive-1-context
        - cors-positive-1-control
      forbidden_evidence_ids: []
