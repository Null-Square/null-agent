    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: compliance-access-control-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: compliance-access-control-positive-1-observation
              content: The review mapped the supplied role matrix and evaluator access sample to the named access-control requirement.
            - id: compliance-access-control-positive-1-floor
              content: The required decision floor is named control requirement, system boundary, evidence sample, owner, exception state, and gap traceability.
            - id: compliance-access-control-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - compliance-access-control-positive-1-observation
        - compliance-access-control-positive-1-floor
        - compliance-access-control-positive-1-control
      forbidden_evidence_ids: []
