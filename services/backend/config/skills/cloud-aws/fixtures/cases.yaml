  - id: cloud-aws-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: cloud-aws-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: cloud-aws-positive-1-observation
              content: An anonymous request read the named private S3 evaluator object while a nonexistent key and authenticated owner request supplied controls.
            - id: cloud-aws-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is public AWS service identification, named synthetic resource, intent/config provenance, and anonymous/control differential.
            - id: cloud-aws-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - cloud-aws-positive-1-observation
        - cloud-aws-positive-1-context
        - cloud-aws-positive-1-control
      forbidden_evidence_ids: []
