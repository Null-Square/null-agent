    input:
      execution:
        task: classify-evidence
        artifact_type: webhook-security-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: webhook-security-positive-1-observation
              content: A changed evaluator event body was accepted because verification covered different bytes; the original signed body was the control.
            - id: webhook-security-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is recorded/synthetic event, raw signature bytes and tenant binding, bounded replay, and disposable consumer state.
            - id: webhook-security-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - webhook-security-positive-1-observation
        - webhook-security-positive-1-context
        - webhook-security-positive-1-control
      forbidden_evidence_ids: []
