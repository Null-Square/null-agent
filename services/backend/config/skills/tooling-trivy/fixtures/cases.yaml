schema_version: 1
skill: tooling-trivy
cases:
  - id: tooling-trivy-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-trivy-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-trivy-positive-1-observation
              content: Trivy scanned the supplied image digest and retained package, installed/fixed versions, layer, and database version.
            - id: tooling-trivy-positive-1-floor
              content: The required decision floor is pinned artifact/database version, production-stage provenance, exact finding record, and reachability/config interpretation.
            - id: tooling-trivy-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-trivy-positive-1-observation
        - tooling-trivy-positive-1-floor
        - tooling-trivy-positive-1-control
      forbidden_evidence_ids: []
