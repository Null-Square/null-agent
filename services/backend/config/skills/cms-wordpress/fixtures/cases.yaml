    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: cms-wordpress-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: cms-wordpress-positive-1-observation
              content: A subscriber read an owner-provided draft canary through an active plugin REST route reserved for editors.
            - id: cms-wordpress-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is active WordPress component, capability, evaluator content, and runtime route/action outcome.
            - id: cms-wordpress-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - cms-wordpress-positive-1-observation
        - cms-wordpress-positive-1-context
        - cms-wordpress-positive-1-control
      forbidden_evidence_ids: []
