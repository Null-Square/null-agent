    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: network-recon-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: network-recon-positive-1-observation
              content: An allowlisted host and port completed the advertised TLS handshake twice with stable SNI and certificate fingerprint.
            - id: network-recon-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is authorized address/port, bounded handshake, stable protocol fingerprint, and ownership provenance.
            - id: network-recon-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - network-recon-positive-1-observation
        - network-recon-positive-1-context
        - network-recon-positive-1-control
      forbidden_evidence_ids: []
