    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: kubernetes-security-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: kubernetes-security-positive-1-observation
              content: The rendered production workload used the default service account despite active intent specifying a restricted evaluator service account.
            - id: kubernetes-security-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is active manifest/runtime attestation, namespace/workload provenance, and bounded public/source consequence.
            - id: kubernetes-security-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - kubernetes-security-positive-1-observation
        - kubernetes-security-positive-1-context
        - kubernetes-security-positive-1-control
      forbidden_evidence_ids: []
