    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-subfinder-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-subfinder-positive-1-observation
              content: Subfinder queried passive sources for the supplied root and retained source attribution for each candidate.
            - id: tooling-subfinder-positive-1-floor
              content: The required decision floor is authorized root domains, passive sources, provenance, current DNS corroboration, and deduplicated output.
            - id: tooling-subfinder-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-subfinder-positive-1-observation
        - tooling-subfinder-positive-1-floor
        - tooling-subfinder-positive-1-control
      forbidden_evidence_ids: []
