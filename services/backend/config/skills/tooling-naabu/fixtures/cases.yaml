    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-naabu-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-naabu-positive-1-observation
              content: Naabu scanned the supplied small port set and a second bounded check confirmed the responsive service.
            - id: tooling-naabu-positive-1-floor
              content: The required decision floor is allowlisted hosts/ports, packet/rate ceiling, bounded confirmation, and network-recon ownership.
            - id: tooling-naabu-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-naabu-positive-1-observation
        - tooling-naabu-positive-1-floor
        - tooling-naabu-positive-1-control
      forbidden_evidence_ids: []
