    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: broad-surface-scan-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: broad-surface-scan-positive-1-observation
              content: A certificate-corroborated hostname resolved inside the allowlist and one HTTPS request produced a distinct application fingerprint.
            - id: broad-surface-scan-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is authorized seed, resolved service identity, bounded handshake, and deduplicated provenance.
            - id: broad-surface-scan-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - broad-surface-scan-positive-1-observation
        - broad-surface-scan-positive-1-context
        - broad-surface-scan-positive-1-control
      forbidden_evidence_ids: []
