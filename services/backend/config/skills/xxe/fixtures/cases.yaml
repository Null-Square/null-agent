  - id: xxe-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: xxe-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: xxe-positive-1-observation
              content: A local parser fixture expanded an entity referencing an evaluator-owned canary document while the DTD-disabled control rejected it.
            - id: xxe-positive-1-floor
              content: The required decision floor is offline XML parser configuration, evaluator-owned entity source, deterministic expansion/access marker, and DTD-disabled control.
            - id: xxe-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - xxe-positive-1-observation
        - xxe-positive-1-floor
        - xxe-positive-1-control
      forbidden_evidence_ids: []
