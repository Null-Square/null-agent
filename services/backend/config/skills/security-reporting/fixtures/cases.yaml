schema_version: 1
skill: security-reporting
cases:
  - id: security-reporting-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: security-reporting-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: security-reporting-positive-1-observation
              content: A report linked every claim to hashed evaluator requests, synthetic canary evidence, and the owning authorization methodology.
            - id: security-reporting-positive-1-floor
              content: The required decision floor is traceable evidence, bounded impact, owner skill, reproducible controls, remediation, and no unsupported claims.
            - id: security-reporting-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - security-reporting-positive-1-observation
        - security-reporting-positive-1-floor
        - security-reporting-positive-1-control
      forbidden_evidence_ids: []
