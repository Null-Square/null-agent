  - id: jwt-attacks-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: jwt-attacks-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: jwt-attacks-positive-1-observation
              content: The evaluator service accepted a token after its signature bytes changed and the authenticated response identified the same evaluator.
            - id: jwt-attacks-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is verified evaluator token, issuer/audience/key provenance, one claim/signature mutation, and application-consumption control.
            - id: jwt-attacks-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - jwt-attacks-positive-1-observation
        - jwt-attacks-positive-1-context
        - jwt-attacks-positive-1-control
      forbidden_evidence_ids: []
