  - id: cloud-azure-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: cloud-azure-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: cloud-azure-positive-1-observation
              content: An anonymous Blob request returned the named private evaluator object while the nonexistent blob and owner request supplied controls.
            - id: cloud-azure-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is public Azure service identity, active configuration provenance, named evaluator artifact, and matched access control.
            - id: cloud-azure-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - cloud-azure-positive-1-observation
        - cloud-azure-positive-1-context
        - cloud-azure-positive-1-control
      forbidden_evidence_ids: []
