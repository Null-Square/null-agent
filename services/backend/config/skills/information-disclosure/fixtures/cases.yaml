          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: information-disclosure-positive-1-observation
              content: A malformed evaluator request returned the owner-provided configuration canary and a valid-request control did not.
            - id: information-disclosure-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is named non-public synthetic datum, repeatable bounded trigger, provenance, and public/authorized controls.
            - id: information-disclosure-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - information-disclosure-positive-1-observation
        - information-disclosure-positive-1-context
        - information-disclosure-positive-1-control
      forbidden_evidence_ids: []
