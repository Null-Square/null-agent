schema_version: 1
skill: clickjacking
cases:
  - id: clickjacking-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: clickjacking-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: clickjacking-positive-1-observation
              content: An owner-hosted frame visibly aligned a target preference control and one evaluator click changed the synthetic preference.
            - id: clickjacking-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is browser-enforced framing, visible alignment, evaluator session, and one harmless sensitive action.
            - id: clickjacking-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - clickjacking-positive-1-observation
        - clickjacking-positive-1-context
        - clickjacking-positive-1-control
      forbidden_evidence_ids: []
