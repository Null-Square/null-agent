      execution:
        task: classify-evidence
        artifact_type: tooling-sqlmap-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-sqlmap-positive-1-observation
              content: sqlmap consumed one supplied request file and parameter, producing a reproducible boolean differential within the cap.
            - id: tooling-sqlmap-positive-1-floor
              content: The required decision floor is single approved endpoint/parameter, conservative options, raw request provenance, request cap, and SQLi validation handoff.
            - id: tooling-sqlmap-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-sqlmap-positive-1-observation
        - tooling-sqlmap-positive-1-floor
        - tooling-sqlmap-positive-1-control
