schema_version: 1
skill: tooling-nuclei
cases:
  - id: tooling-nuclei-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-nuclei-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-nuclei-positive-1-observation
              content: Nuclei ran pinned template ids/version against the allowlisted evaluator target at the fixed rate, retained the raw matcher record, and the named specialist replay confirmed the inert canary outcome.
            - id: tooling-nuclei-positive-1-floor
              content: The required decision floor is pinned template ids/version, allowlisted targets, rate cap, raw matcher evidence, and specialist validation.
            - id: tooling-nuclei-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-nuclei-positive-1-observation
        - tooling-nuclei-positive-1-floor
        - tooling-nuclei-positive-1-control
      forbidden_evidence_ids: []
