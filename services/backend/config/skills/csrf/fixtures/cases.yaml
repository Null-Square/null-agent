schema_version: 1
skill: csrf
cases:
  - id: csrf-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: csrf-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: csrf-positive-1-observation
              content: An owner-controlled origin submitted the evaluator preference action without a token and the follow-up read confirmed the change.
            - id: csrf-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is browser session, cross-site request, missing/bad anti-CSRF binding, and authoritative harmless state read.
            - id: csrf-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - csrf-positive-1-observation
        - csrf-positive-1-context
        - csrf-positive-1-control
      forbidden_evidence_ids: []
