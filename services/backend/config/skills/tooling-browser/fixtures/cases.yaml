schema_version: 1
skill: tooling-browser
cases:
  - id: tooling-browser-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-browser-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-browser-positive-1-observation
              content: The browser captured an evaluator OAuth redirect, cookie attributes, and correlated network request ids without unrelated profile state.
            - id: tooling-browser-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is clean evaluator profile, bounded browser action, raw/network provenance, and domain-skill handoff.
            - id: tooling-browser-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-browser-positive-1-observation
        - tooling-browser-positive-1-context
        - tooling-browser-positive-1-control
      forbidden_evidence_ids: []
