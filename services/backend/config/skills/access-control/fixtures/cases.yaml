schema_version: 1
skill: access-control
cases:
  - id: access-control-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: access-control-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: access-control-positive-1-observation
              content: Evaluator member A changed only the invoice id and received member B’s synthetic invoice canary.
            - id: access-control-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is subject, object, action, ownership, and matched deny/owner controls.
            - id: access-control-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - access-control-positive-1-observation
        - access-control-positive-1-context
        - access-control-positive-1-control
      forbidden_evidence_ids: []
