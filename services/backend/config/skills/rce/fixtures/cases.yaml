            - id: rce-positive-1-observation
              content: An instrumented local handler passed the inert B1 marker to the mocked interpreter boundary while the fixed implementation kept it data-only.
            - id: rce-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is active source-to-interpreter path in a disposable harness, inert evaluator marker, and fixed/escaped control.
