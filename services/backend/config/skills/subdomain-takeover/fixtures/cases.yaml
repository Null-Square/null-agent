    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: subdomain-takeover-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: subdomain-takeover-positive-1-observation
              content: The in-scope CNAME targeted the owner-provided deprovisioned service fixture and the provider’s authoritative unclaimed response matched it.
            - id: subdomain-takeover-positive-1-floor
              content: The required decision floor is in-scope DNS record, unclaimed provider state proven by owner-supplied fixture/authoritative response, and no registration attempt.
            - id: subdomain-takeover-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - subdomain-takeover-positive-1-observation
        - subdomain-takeover-positive-1-floor
        - subdomain-takeover-positive-1-control
      forbidden_evidence_ids: []
