schema_version: 1
skill: tooling-katana
cases:
  - id: tooling-katana-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-katana-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-katana-positive-1-observation
              content: Katana crawled one supplied SPA seed at depth two and retained normalized routes and forms within the host allowlist.
            - id: tooling-katana-positive-1-floor
              content: The required decision floor is authorized seed, depth/request cap, same-site boundary, request ledger, and inventory-only output.
            - id: tooling-katana-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-katana-positive-1-observation
        - tooling-katana-positive-1-floor
        - tooling-katana-positive-1-control
      forbidden_evidence_ids: []
