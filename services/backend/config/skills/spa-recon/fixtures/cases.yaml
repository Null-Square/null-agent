        task: classify-evidence
        artifact_type: spa-recon-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: spa-recon-positive-1-observation
              content: Router metadata and a loaded lazy chunk identified the billing export route confirmed by normal evaluator navigation.
            - id: spa-recon-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is loaded client asset or runtime traffic, provenance, deduplicated route/API/config item, and non-mutating corroboration.
            - id: spa-recon-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - spa-recon-positive-1-observation
        - spa-recon-positive-1-context
        - spa-recon-positive-1-control
      forbidden_evidence_ids: []
