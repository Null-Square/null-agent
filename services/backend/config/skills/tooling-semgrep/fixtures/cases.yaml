              content: The required decision floor is pinned ruleset/source revision, complete dataflow context, triage disposition, and runtime handoff where required.
            - id: tooling-semgrep-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-semgrep-positive-1-observation
        - tooling-semgrep-positive-1-floor
        - tooling-semgrep-positive-1-control
