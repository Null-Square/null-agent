schema_version: 1
skill: compliance-reporting
cases:
  - id: compliance-reporting-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: compliance-reporting-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: compliance-reporting-positive-1-observation
              content: The report tied each conclusion to control id, procedure, sample, evidence hashes, and reviewer disposition.
            - id: compliance-reporting-positive-1-floor
              content: The required decision floor is traceable control results, evidence references, exceptions, limitations, ownership, and status consistency.
            - id: compliance-reporting-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - compliance-reporting-positive-1-observation
        - compliance-reporting-positive-1-floor
        - compliance-reporting-positive-1-control
      forbidden_evidence_ids: []
