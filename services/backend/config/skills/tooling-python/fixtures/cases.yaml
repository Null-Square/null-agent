    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-python-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-python-positive-1-observation
              content: A Python harness normalized two captured responses and asserted only the synthetic object-canary field differed.
            - id: tooling-python-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is reviewed bounded harness, explicit allowlist/caps/timeouts, machine-readable ledger, and domain-skill oracle.
            - id: tooling-python-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-python-positive-1-observation
        - tooling-python-positive-1-context
        - tooling-python-positive-1-control
      forbidden_evidence_ids: []
