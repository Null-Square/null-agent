    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-grpcurl-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-grpcurl-positive-1-observation
              content: grpcurl used authorized reflection to list the supplied service once and recorded target, TLS mode, and descriptor provenance.
            - id: tooling-grpcurl-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is authorized target/descriptor, bounded unary message, redacted metadata, and retained status/response evidence.
            - id: tooling-grpcurl-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-grpcurl-positive-1-observation
        - tooling-grpcurl-positive-1-context
        - tooling-grpcurl-positive-1-control
      forbidden_evidence_ids: []
