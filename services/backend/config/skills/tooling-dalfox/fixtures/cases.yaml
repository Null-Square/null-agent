schema_version: 1
skill: tooling-dalfox
cases:
  - id: tooling-dalfox-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-dalfox-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-dalfox-positive-1-observation
              content: Dalfox tested one supplied evaluator parameter and retained a reproducible inert browser marker with raw request provenance.
            - id: tooling-dalfox-positive-1-floor
              content: The required decision floor is bounded XSS parameter set, evaluator URL, reproducible browser evidence, and xss/dom-xss handoff.
            - id: tooling-dalfox-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-dalfox-positive-1-observation
        - tooling-dalfox-positive-1-floor
        - tooling-dalfox-positive-1-control
      forbidden_evidence_ids: []
