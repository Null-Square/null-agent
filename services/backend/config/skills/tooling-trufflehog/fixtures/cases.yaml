        task: classify-evidence
        artifact_type: tooling-trufflehog-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-trufflehog-positive-1-observation
              content: TruffleHog scanned the supplied commit range and retained a redacted detector match with commit/file provenance.
            - id: tooling-trufflehog-positive-1-floor
              content: The required decision floor is bounded repository/history scope, detector/version provenance, verified-without-use policy, and redacted evidence.
            - id: tooling-trufflehog-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-trufflehog-positive-1-observation
        - tooling-trufflehog-positive-1-floor
        - tooling-trufflehog-positive-1-control
