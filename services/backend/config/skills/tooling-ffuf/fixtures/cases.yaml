schema_version: 1
skill: tooling-ffuf
cases:
  - id: tooling-ffuf-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-ffuf-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-ffuf-positive-1-observation
              content: ffuf used the supplied ten-entry wordlist and one URL placeholder, recording two distinct non-baseline routes.
            - id: tooling-ffuf-positive-1-floor
              content: The required decision floor is explicit wordlist/target template, request/rate cap, stable baseline filter, and inventory-only interpretation.
            - id: tooling-ffuf-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-ffuf-positive-1-observation
        - tooling-ffuf-positive-1-floor
        - tooling-ffuf-positive-1-control
      forbidden_evidence_ids: []
