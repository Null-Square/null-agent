schema_version: 1
skill: compliance-planning
cases:
  - id: compliance-planning-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: compliance-planning-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: compliance-planning-positive-1-observation
              content: The plan mapped every in-scope control to owner, evidence source, due date, and review procedure.
            - id: compliance-planning-positive-1-floor
              content: The required decision floor is defined framework/scope/period, control inventory, evidence owners, sampling, dependencies, and no invented authority.
            - id: compliance-planning-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - compliance-planning-positive-1-observation
        - compliance-planning-positive-1-floor
        - compliance-planning-positive-1-control
      forbidden_evidence_ids: []
