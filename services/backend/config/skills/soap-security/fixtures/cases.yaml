    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: soap-security-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: soap-security-positive-1-observation
              content: An anonymous envelope called an operation marked authenticated and returned the private B1 SOAP canary.
            - id: soap-security-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is supplied WSDL/operation, schema-valid evaluator envelope, identity/object controls, and semantic SOAP result.
            - id: soap-security-positive-1-control
              content: The matched evaluator baseline and negative control did not produce the candidate outcome; target, identity, synthetic data, and request budget were held constant.
    expected:
      disposition: proof
      finding_allowed: true
      required_evidence_ids:
        - soap-security-positive-1-observation
        - soap-security-positive-1-context
        - soap-security-positive-1-control
      forbidden_evidence_ids: []
