schema_version: 1
skill: tooling-nmap
cases:
  - id: tooling-nmap-positive-1
    kind: positive
    input:
      execution:
        task: classify-evidence
        artifact_type: tooling-nmap-positive-evidence-packet
        authorization:
          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: tooling-nmap-positive-1-observation
              content: Nmap performed version detection on the supplied two ports with a conservative timing template and retained raw XML.
            - id: tooling-nmap-positive-1-floor
              content: The required decision floor is approved target/port/script set, safe timing, raw output provenance, and service-level interpretation.
            - id: tooling-nmap-positive-1-control
              content: A matched negative/baseline control did not produce the candidate outcome while scope and evaluator data stayed fixed.
    expected:
      disposition: proof
      finding_allowed: false
      required_evidence_ids:
        - tooling-nmap-positive-1-observation
        - tooling-nmap-positive-1-floor
        - tooling-nmap-positive-1-control
      forbidden_evidence_ids: []
