          policy_allowed: true
          infrastructure_available: true
        artifact:
          scenario: positive-1
          observations:
            - id: session-management-positive-1-observation
              content: The pre-password-change evaluator session still read its private canary beyond the invalidation window.
            - id: session-management-positive-1-context
              content: The artifact retained the exact bounded evaluator context for review. The decision floor is evaluator session identifiers, documented lifecycle transition, before/after authenticated read, and revocation cleanup.
