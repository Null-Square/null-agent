global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Note: AlertManager removed - using Grafana Alerting instead
# Alerts are defined in grafana/provisioning/alerting/

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    static_configs:
      - targets: ["backend:3001"]
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 15s
    scrape_timeout: 10s
